name: Food Radar VN daily review package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attempt guarded platform publishing"
        required: false
        default: false
        type: boolean
  schedule:
    # 01:20 UTC = 08:20 Vietnam time. The generated package remains review-only by default.
    - cron: "20 1 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/foodworld
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TEXT_MODEL: gpt-5-mini
      FOODWORLD_APPROVAL_MODE: ${{ vars.FOODWORLD_APPROVAL_MODE || 'review' }}
      FOODWORLD_PUBLISH_ENABLED: ${{ vars.FOODWORLD_PUBLISH_ENABLED || 'false' }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_MODE: ${{ vars.TIKTOK_MODE || 'inbox' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: automation/foodworld/pyproject.toml
      - name: Install FFmpeg and package
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install -e ".[dev]"
      - name: Prepare config
        run: cp config.example.yml config.yml
      - name: Restore discovery state
        uses: actions/cache@v4
        with:
          path: automation/foodworld/runtime/state.json
          key: foodworld-state-${{ github.run_id }}
          restore-keys: |
            foodworld-state-
      - name: Test
        run: pytest
      - name: Generate review package
        shell: bash
        run: |
          if [[ "${{ github.event.inputs.publish }}" == "true" ]]; then
            python -m foodworld --config config.yml generate --publish
          else
            python -m foodworld --config config.yml generate
          fi
      - name: Upload package for review
        uses: actions/upload-artifact@v4
        with:
          name: food-radar-vn-${{ github.run_number }}
          path: automation/foodworld/runtime/output/
          retention-days: 14
